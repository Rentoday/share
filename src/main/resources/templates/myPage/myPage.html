<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/myPage/myPage.css">
    <link rel="stylesheet" href="css/myPage/info.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1 id="page-title">알림 내역</h1>
    </div>
    <div class="sidebar">
        <ul id="sidebar-menu">
            <li data-content="info">내 정보</li>
            <li data-content="notifications">알림 내역</li>
            <li data-content="reservations">예약 정보</li>
            <li data-content="sales-info">판매 정보</li>
            <li data-content="approval-requests">승인 요청</li>
            <li data-content="payment-history">결제 내역</li>
        </ul>
    </div>
    <div class="main-content">
        <div id="info-content" class="content">
            <div class="profile-container">
                <div class="profile-info">
                    <div class="profile-pic-container">
                        <img id="profile-pic" src="image/member/profile.svg" alt="Profile" class="profile-pic">
                        <input type="file" id="profile-pic-input" accept="image/*" style="display: none;">
                        <label for="profile-pic-input" class="profile-pic-edit">수정</label>
                    </div>
                    <div class="profile-name" id="profile-name"></div>
                </div>
            </div>
            <form class="info-form">
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" readonly>
                </div>
                <div class="form-group">
                    <label for="phone">핸드폰 번호</label>
                    <input type="text" id="phone">
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password">
                </div>
                <div class="form-group">
                    <label for="confirm-password">비밀번호 확인</label>
                    <input type="password" id="confirm-password">
                </div>
                <div class="buttons">
                    <button type="submit" class="save-btn">수정하기</button>
                    <button type="button" class="cancel-btn">탈퇴하기</button>
                </div>
            </form>
        </div>
        <div id="notifications-content" class="content">
            <div class="button-container">
                <button class="delete-btn">삭제하기</button>
            </div>
            <table>
                <thead>
                <tr>
                    <th>선택</th>
                    <th>알림번호</th>
                    <th>내용</th>
                    <th>알림일</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td><input type="checkbox" class="checkbox"></td>
                    <td>1</td>
                    <td>mong@naver.com</td>
                    <td>24/07/21</td>
                </tr>
                <tr>
                    <td colspan="4">조회된 알림이 없습니다.</td>
                </tr>
                </tbody>
            </table>
            <div class="pagination">
                <button>&lt;</button>
                <button class="active">1</button>
                <button>2</button>
                <button>3</button>
                <button>&gt;</button>
            </div>
        </div>
        <div id="reservations-content" class="content">
            <table>
                <thead>
                <tr>
                    <th>예약번호</th>
                    <th>구획번호</th>
                    <th>주소</th>
                    <th>예약시간</th>
                    <th>금액</th>
                    <th>예약일</th>
                </tr>
                </thead>
                <tbody id="reservations-body">
                <!-- 데이터가 여기에 동적으로 추가됩니다 -->
                </tbody>
            </table>
            <div class="pagination">
                <button>&lt;</button>
                <button class="active">1</button>
                <button>2</button>
                <button>3</button>
                <button>&gt;</button>
            </div>
        </div>
        <div id="sales-info-content" class="content">
            <div class="button-container">
                <button class="delete-btn" id="delete-selected-sales">삭제하기</button>
            </div>
            <table>
                <thead>
                <tr>
                    <th>선택</th>
                    <th>판매번호</th>
                    <th>구획번호</th>
                    <th>주소</th>
                    <th>판매시간</th>
                    <th>금액</th>
                    <th>판매일</th>
                </tr>
                </thead>
                <tbody id="sales-info-body">
                <!-- 데이터가 여기에 동적으로 추가됩니다 -->
                </tbody>
            </table>
            <div class="pagination">
                <button>&lt;</button>
                <button class="active">1</button>
                <button>2</button>
                <button>3</button>
                <button>&gt;</button>
            </div>
        </div>
        <div id="approval-requests-content" class="content">
            <div class="button-container">
                <button class="delete-btn" id="delete-selected">삭제하기</button>
            </div>
            <table>
                <thead>
                <tr>
                    <th>선택</th>
                    <th>검토번호</th>
                    <th>판매자</th>
                    <th>구획번호</th>
                    <th>주소</th>
                    <th>금액</th>
                    <th>신청일</th>
                    <th>상태</th>
                </tr>
                </thead>
                <tbody id="approval-requests-body">
                <!-- 데이터가 여기에 동적으로 추가됩니다 -->
                </tbody>
            </table>
            <div class="pagination">
                <button>&lt;</button>
                <button class="active">1</button>
                <button>2</button>
                <button>3</button>
                <button>&gt;</button>
            </div>
        </div>
        <div id="payment-history-content" class="content">
            <table>
                <thead>
                <tr>
                    <th>결제번호</th>
                    <th>구획번호</th>
                    <th>주소</th>
                    <th>판매시간</th>
                    <th>금액</th>
                    <th>결제일</th>
                    <th>상태</th>
                </tr>
                </thead>
                <tbody id="payment-history-body">
                <!-- 데이터가 여기에 동적으로 추가됩니다 -->
                </tbody>
            </table>
            <div class="pagination">
                <button>&lt;</button>
                <button class="active">1</button>
                <button>2</button>
                <button>3</button>
                <button>&gt;</button>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const sidebarMenu = document.getElementById('sidebar-menu');
        const contents = document.querySelectorAll('.content');
        const pageTitle = document.getElementById('page-title');

        let currentPage = 0;
        const pageSize = 10;

        const fetchMemberInfo = async () => {
        try {
            const response = await fetch('/api/members/info', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            if (!response.ok) {
                throw new Error('회원 정보를 가져오지 못했습니다.');
            }
            const data = await response.json();
            updateMemberInfo(data);
        } catch (error) {
            console.error('회원 정보를 가져오는 중 오류 발생:', error);
        }
    };

    const updateMemberInfo = (data) => {
        document.getElementById('profile-name').textContent = data.name;
        document.getElementById('email').value = data.email;
        document.getElementById('phone').value = data.phone;
        if (data.profileImage) {
            document.getElementById('profile-pic').src = data.profileImage;
        }
    };

        // 프로필 이미지 수정 기능
        const profilePic = document.getElementById('profile-pic');
        const profilePicInput = document.getElementById('profile-pic-input');

        if (profilePicInput) {
            profilePicInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        profilePic.src = e.target.result;
                    }
                    reader.readAsDataURL(file);
                }
            });
        }

        const fetchReservations = async (page = 0) => {
            try {
                const response = await fetch(`/api/reservations/member?page=${page}&size=${pageSize}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                if (!response.ok) {
                    throw new Error('예약 정보를 가져오지 못했습니다.');
                }
                const data = await response.json();
                updateReservationsTable(data.content);
                updatePagination(data, 'reservations');
            } catch (error) {
                console.error('예약 정보를 가져오는 중 오류 발생:', error);
            }
        };

        const updateReservationsTable = (reservations) => {
            const tableBody = document.getElementById('reservations-body');
            tableBody.innerHTML = '';

            if (reservations.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6">조회된 예약 정보가 없습니다.</td></tr>';
                return;
            }

            reservations.forEach(reservation => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${reservation.id}</td>
                    <td>${reservation.parkingLotNumber}</td>
                    <td>${reservation.address}</td>
                    <td>${reservation.startTime} ~ ${reservation.endTime}</td>
                    <td>${reservation.price}</td>
                    <td>${new Date(reservation.reservationDate).toLocaleDateString()}</td>
                `;
                tableBody.appendChild(row);
            });
        };

        const fetchPaymentHistory = async (page = 0) => {
            try {
                const response = await fetch(`/api/pays/member?page=${page}&size=${pageSize}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                if (!response.ok) {
                    throw new Error('결제 내역을 가져오지 못했습니다.');
                }
                const data = await response.json();
                updatePaymentHistoryTable(data.content);
                updatePagination(data, 'payment-history');
            } catch (error) {
                console.error('결제 내역을 가져오는 중 오류 발생:', error);
            }
        };

        const updatePaymentHistoryTable = (data) => {
            const tableBody = document.getElementById('payment-history-body');
            tableBody.innerHTML = '';

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7">조회된 결제 내역이 없습니다.</td></tr>';
                return;
            }

            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.pay.park.parkingLot.number}</td>
                    <td>${item.pay.park.parkingLot.address}</td>
                    <td>${item.pay.park.startTime} ~ ${item.pay.park.endTime}</td>
                    <td>${item.pay.amount}</td>
                    <td>${new Date(item.pay.paymentDate).toLocaleDateString()}</td>
                    <td>${item.pay.paymentStatus}</td>
                `;
                tableBody.appendChild(row);
            });
        };

        const fetchSalesInfo = async (page = 0) => {
            try {
                const response = await fetch(`/api/parks/confirmed/member?page=${page}&size=${pageSize}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                if (!response.ok) {
                    throw new Error('판매 정보를 가져오지 못했습니다.');
                }
                const data = await response.json();
                updateSalesInfoTable(data.content);
                updatePagination(data, 'sales-info');
            } catch (error) {
                console.error('판매 정보를 가져오는 중 오류 발생:', error);
            }
        };

        const updateSalesInfoTable = (sales) => {
            const tableBody = document.getElementById('sales-info-body');
            tableBody.innerHTML = '';

            if (sales.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7">조회된 판매 정보가 없습니다.</td></tr>';
                return;
            }

            sales.forEach(sale => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><input type="checkbox" class="checkbox" data-park-id="${sale.id}"></td>
                    <td>${sale.id}</td>
                    <td>${sale.park.parkingLot.number}</td>
                    <td>${sale.park.parkingLot.address}</td>
                    <td>${sale.park.startTime} ~ ${sale.park.endTime}</td>
                    <td>${sale.park.price}</td>
                    <td>${new Date(sale.confirmDate).toLocaleDateString()}</td>
                `;
                tableBody.appendChild(row);
            });
        };

        const deleteSelectedSales = async () => {
            const selectedCheckboxes = document.querySelectorAll('#sales-info-body input[type="checkbox"]:checked');
            const parkIds = Array.from(selectedCheckboxes).map(checkbox => checkbox.dataset.parkId);

            for (const parkId of parkIds) {
                try {
                    const response = await fetch(`/api/parks/${parkId}`, {
                        method: 'DELETE'
                    });
                    if (!response.ok) {
                        throw new Error(`주차장 ID ${parkId} 삭제 실패`);
                    }
                } catch (error) {
                    console.error('주차장 삭제 중 오류 발생:', error);
                }
            }

            // 삭제 후 테이블 새로고침
            fetchSalesInfo();
        };

        const fetchApprovalRequests = async (page = 0) => {
            try {
                const response = await fetch(`/api/parks/member?page=${page}&size=${pageSize}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                if (!response.ok) {
                    throw new Error('승인 요청 정보를 가져오지 못했습니다.');
                }
                const data = await response.json();
                updateApprovalRequestsTable(data.content);
                updatePagination(data, 'approval-requests');
            } catch (error) {
                console.error('승인 요청 데이터를 가져오는 중 오류 발생:', error);
            }
        };

        const updateApprovalRequestsTable = (data) => {
            const tableBody = document.getElementById('approval-requests-body');
            tableBody.innerHTML = '';

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="8">조회된 승인 요청이 없습니다.</td></tr>';
                return;
            }

            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><input type="checkbox" class="checkbox" data-park-id="${item.id}"></td>
                    <td>${item.id}</td>
                    <td>${item.park.member.name}</td>
                    <td>${item.park.parkingLot.number}</td>
                    <td>${item.park.parkingLot.address}</td>
                    <td>${item.park.price}</td>
                    <td>${new Date(item.park.createdDate).toLocaleDateString()}</td>
                    <td>${item.park.parkStatus}</td>
                `;
                tableBody.appendChild(row);
            });
        };

        const deleteSelectedParks = async () => {
            const selectedCheckboxes = document.querySelectorAll('#approval-requests-body input[type="checkbox"]:checked');
            const parkIds = Array.from(selectedCheckboxes).map(checkbox => checkbox.dataset.parkId);

            for (const parkId of parkIds) {
                try {
                    const response = await fetch(`/api/parks/${parkId}`, {
                        method: 'DELETE'
                    });
                    if (!response.ok) {
                        throw new Error(`주차장 ID ${parkId} 삭제 실패`);
                    }
                } catch (error) {
                    console.error('주차장 삭제 중 오류 발생:', error);
                }
            }

            // 삭제 후 테이블 새로고침
            fetchApprovalRequests();
        };

        const updatePagination = (data, sectionId) => {
            const paginationDiv = document.querySelector(`#${sectionId}-content .pagination`);
            paginationDiv.innerHTML = '';

            const totalPages = data.totalPages;
            const currentPage = data.number;

            // 이전 페이지 버튼
            const prevButton = document.createElement('button');
            prevButton.textContent = '<';
            prevButton.disabled = currentPage === 0;
            prevButton.addEventListener('click', () => loadPage(sectionId, currentPage - 1));
            paginationDiv.appendChild(prevButton);

            // 페이지 번호 버튼
            for (let i = 0; i < totalPages; i++) {
                const pageButton = document.createElement('button');
                pageButton.textContent = i + 1;
                pageButton.classList.toggle('active', i === currentPage);
                pageButton.addEventListener('click', () => loadPage(sectionId, i));
                paginationDiv.appendChild(pageButton);
            }

            // 다음 페이지 버튼
            const nextButton = document.createElement('button');
            nextButton.textContent = '>';
            nextButton.disabled = currentPage === totalPages - 1;
            nextButton.addEventListener('click', () => loadPage(sectionId, currentPage + 1));
            paginationDiv.appendChild(nextButton);
        };

        const loadPage = (sectionId, page) => {
            currentPage = page;
            switch (sectionId) {
                case 'reservations':
                    fetchReservations(page);
                    break;
                case 'sales-info':
                    fetchSalesInfo(page);
                    break;
                case 'approval-requests':
                    fetchApprovalRequests(page);
                    break;
                case 'payment-history':
                    fetchPaymentHistory(page);
                    break;
            }
        };

        // 사이드바 메뉴에 이벤트 리스너 추가
        sidebarMenu.addEventListener('click', (e) => {
            if (e.target.tagName === 'LI') {
                // 모든 사이드바 항목에서 active 클래스 제거
                Array.from(sidebarMenu.getElementsByTagName('li')).forEach(li => {
                    li.classList.remove('active');
                });

                // 클릭된 항목에 active 클래스 추가
                e.target.classList.add('active');

                // 모든 컨텐츠 숨기기
                contents.forEach(content => {
                    content.classList.remove('active');
                });

                // 클릭된 컨텐츠 표시
                const contentId = e.target.dataset.content + '-content';
                document.getElementById(contentId).classList.add('active');

                // 페이지 제목 업데이트
                pageTitle.textContent = e.target.textContent;

                // 각 섹션에 맞는 데이터 로드
                currentPage = 0; // 새 섹션을 로드할 때 페이지를 리셋
                switch (e.target.dataset.content) {
                    case 'info':
                        fetchMemberInfo();
                        break;
                    case 'reservations':
                        fetchReservations(currentPage);
                        break;
                    case 'sales-info':
                        fetchSalesInfo(currentPage);
                        break;
                    case 'approval-requests':
                        fetchApprovalRequests(currentPage);
                        break;
                    case 'payment-history':
                        fetchPaymentHistory(currentPage);
                        break;
                }
            }
        });

        // 삭제 버튼에 이벤트 리스너 추가
        document.getElementById('delete-selected').addEventListener('click', deleteSelectedParks);
        document.getElementById('delete-selected-sales').addEventListener('click', deleteSelectedSales);

        // 페이지 로드 시 "내 정보" 섹션을 기본으로 표시
        const defaultSection = document.querySelector('[data-content="info"]');
        defaultSection.classList.add('active');
        document.getElementById('info-content').classList.add('active');
        pageTitle.textContent = '내 정보';
    });
</script>
</body>
</html>

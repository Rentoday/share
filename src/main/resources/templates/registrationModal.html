<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주차구역 관리 등록</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .frame_modal_registration {
            width: 719px;
            height: 877px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 100px;
            text-align: right;
            margin-right: 10px;
        }
        input[type="text"], textarea {
            width: calc(100% - 120px);
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .time-group {
            display: flex;
            align-items: center;
        }
        .time-group input {
            width: 100px;
        }
        .time-group span {
            margin: 0 10px;
        }
        textarea {
            height: 100px;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="frame_modal_registration">
    <h2>주차구역 관리 등록</h2>
    <form>
        <div class="form-group">
            <label for="carNumber">차량번호:</label>
            <input type="text" id="carNumber" name="carNumber" value="12가1234">
        </div>
        <div class="form-group">
            <label for="parkingNumber">구획번호:</label>
            <input type="text" id="parkingNumber" name="parkingNumber" value="12가1234">
        </div>
        <div class="form-group time-group">
            <label for="startTime">시간:</label>
            <input type="text" id="startTime" name="startTime" value="09:00">
            <span>~</span>
            <input type="text" id="endTime" name="endTime" value="09:00">
        </div>
        <div class="form-group">
            <label for="fee">시간당 요금:</label>
            <input type="text" id="fee" name="fee" value="3000">
        </div>
        <div class="form-group">
            <label for="details">상세설명:</label>
            <textarea id="details" name="details">12가1234</textarea>
        </div>
        <div class="form-group">
            <label for="image">이미지:</label>
            <input type="text" id="image" name="image">
        </div>
        <div class="form-group">
            <label for="manager">소유확인증:</label>
            <input type="text" id="manager" name="manager">
        </div>
        <button type="submit">판매신청</button>
    </form>
</div>
</body>
</html>

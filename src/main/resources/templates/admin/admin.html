<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin/admin.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1 id="page-title">공지사항</h1>
    </div>
    <div class="sidebar">
        <ul id="sidebar-menu">
            <li data-content="members" class="active">회원 조회</li>
            <li data-content="sales">판매 상품 조회</li>
            <li data-content="confirm">판매 상품 검토</li>
            <li data-content="notice">공지사항</li>
        </ul>
    </div>
    <div class="main-content">
        <div id="members-content" class="content active">
            <h2>회원 조회</h2>
            <p>여기에 내 정보 관련 내용을 추가하세요.</p>
        </div>
        <div id="sales-content" class="content">
            <table>
                <thead>
                <tr>
                    <th>판매번호</th>
                    <th>판매자</th>
                    <th>구획번호</th>
                    <th>주소</th>
                    <th>시간</th>
                    <th>금액</th>
                    <th>등록일</th>
                </tr>
                </thead>
                <tbody id="sales-table-body">
                <!-- 데이터는 여기에 동적으로 추가됩니다 -->
                </tbody>
            </table>
            <div class="pagination">
                <button>&lt;</button>
                <button class="active">1</button>
                <button>2</button>
                <button>3</button>
                <button>&gt;</button>
            </div>
        </div>
        <div id="confirm-content" class="content">
            <table>
                <thead>
                <tr>
                    <th>검토번호</th>
                    <th>판매자</th>
                    <th>구획번호</th>
                    <th>주소</th>
                    <th>금액</th>
                    <th>신청일</th>
                    <th>상태</th>
                </tr>
                </thead>
                <tbody id="confirm-table-body">
                <!-- 데이터는 여기에 동적으로 추가됩니다 -->
                </tbody>
            </table>
            <div class="pagination">
                <button>&lt;</button>
                <button class="active">1</button>
                <button>2</button>
                <button>3</button>
                <button>&gt;</button>
            </div>
        </div>
        <div id="notice-content" class="content">
            <div class="button-container">
                <button class="delete-btn" id="delete-selected">삭제하기</button>
                <button class="create-btn">공지작성</button>
            </div>
            <table>
                <thead>
                <tr>
                    <th>선택</th>
                    <th>공지번호</th>
                    <th>제목</th>
                    <th>작성일</th>
                </tr>
                </thead>
                <tbody id="notice-table-body">
                <!-- 데이터는 여기에 동적으로 추가됩니다 -->
                </tbody>
            </table>
            <div class="pagination" id="notice-pagination">
                <!-- 페이지네이션 버튼은 여기에 동적으로 추가됩니다 -->
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const sidebarMenu = document.getElementById('sidebar-menu');
        const contents = document.querySelectorAll('.content');
        const pageTitle = document.getElementById('page-title');

        let currentSalesPage = 0;
        let currentConfirmPage = 0;
        let currentNoticePage = 0;
        const pageSize = 10;

const fetchNotices = async (page = 0) => {
        try {
            const response = await fetch(`/api/notice/readall?page=${page}&size=${pageSize}`);
            if (!response.ok) {
                throw new Error('공지사항 조회에 실패했습니다.');
            }
            const data = await response.json();
            updateNoticeTable(data);
            updatePagination(data, 'notice');
        } catch (error) {
            console.error('공지사항 조회 중 오류 발생:', error);
        }
    };

    const updateNoticeTable = (notices) => {
        const tableBody = document.getElementById('notice-table-body');
        tableBody.innerHTML = '';

        if (notices.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4">조회된 공지사항이 없습니다.</td></tr>';
            return;
        }

        notices.forEach((notice, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><input type="checkbox" class="notice-checkbox" data-id="${notice.id}"></td>
                <td>${notice.id}</td>
                <td>${notice.title}</td>
                <td>${notice.createdAt}</td>
            `;
            tableBody.appendChild(row);
        });
    };

    // 삭제 기능 구현
    const deleteButton = document.getElementById('delete-selected');
    deleteButton.addEventListener('click', async () => {
        const selectedNotices = document.querySelectorAll('.notice-checkbox:checked');
        const noticeIds = Array.from(selectedNotices).map(checkbox => checkbox.dataset.id);

        if (noticeIds.length === 0) {
            alert('삭제할 공지사항을 선택해주세요.');
            return;
        }

        try {
            const response = await fetch('/api/notice/delete', {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(noticeIds),
            });

            if (!response.ok) {
                throw new Error('공지사항 삭제에 실패했습니다.');
            }

            alert('선택한 공지사항이 삭제되었습니다.');
            fetchNotices(currentNoticePage); // 현재 페이지 새로고침
        } catch (error) {
            console.error('공지사항 삭제 중 오류 발생:', error);
            alert('공지사항 삭제 중 오류가 발생했습니다.');
        }
    });

        const fetchConfirmedParks = async (page = 0) => {
            try {
                const response = await fetch(`/api/parks/confirmed?page=${page}&size=${pageSize}`);
                if (!response.ok) {
                    throw new Error('판매 상품 조회에 실패했습니다.');
                }
                const data = await response.json();
                updateSalesTable(data.content);
                updatePagination(data, 'sales');
            } catch (error) {
                console.error('판매 상품 조회 중 오류 발생:', error);
            }
        };

         const updateSalesTable = (parks) => {
            const tableBody = document.getElementById('sales-table-body');
            tableBody.innerHTML = '';

            if (parks.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7">조회된 판매 상품이 없습니다.</td></tr>';
                return;
            }

            parks.forEach(park => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${park.id}</td>
                    <td>${park.park.member.name}</td>
                    <td>${park.park.parkingLot.number}</td>
                    <td>${park.park.parkingLot.address}</td>
                    <td>${park.park.startTime} ~ ${park.park.endTime}</td>
                    <td>${park.park.price}</td>
                    <td>${new Date(park.park.createdDate).toLocaleDateString()}</td>
                `;
                tableBody.appendChild(row);
            });
        };

        const fetchAllParks = async (page = 0) => {
            try {
                const response = await fetch(`/api/parks?page=${page}&size=${pageSize}`);
                if (!response.ok) {
                    throw new Error('판매 상품 검토 조회에 실패했습니다.');
                }
                const data = await response.json();
                updateConfirmTable(data.content);
                updatePagination(data, 'confirm');
            } catch (error) {
                console.error('판매 상품 검토 조회 중 오류 발생:', error);
            }
        };

        const updateConfirmTable = (parks) => {
            const tableBody = document.getElementById('confirm-table-body');
            tableBody.innerHTML = '';

            if (parks.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7">조회된 판매 상품 검토가 없습니다.</td></tr>';
                return;
            }

            parks.forEach(park => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${park.id}</td>
                    <td>${park.park.member.name}</td>
                    <td>${park.park.parkingLot.number}</td>
                    <td>${park.park.parkingLot.address}</td>
                    <td>${park.park.price}</td>
                    <td>${new Date(park.park.createdDate).toLocaleDateString()}</td>
                    <td>${park.park.parkStatus}</td>
                `;
                tableBody.appendChild(row);
            });
        };

        const updatePagination = (data, section) => {
            const paginationDiv = document.getElementById(`${section}-pagination`);
            paginationDiv.innerHTML = '';

            const totalPages = data.totalPages;
            const currentPage = data.number;

            // 이전 페이지 버튼
            const prevButton = document.createElement('button');
            prevButton.textContent = '<';
            prevButton.disabled = currentPage === 0;
            prevButton.addEventListener('click', () => loadPage(section, currentPage - 1));
            paginationDiv.appendChild(prevButton);

            // 페이지 번호 버튼
            for (let i = 0; i < totalPages; i++) {
                const pageButton = document.createElement('button');
                pageButton.textContent = i + 1;
                pageButton.classList.toggle('active', i === currentPage);
                pageButton.addEventListener('click', () => loadPage(section, i));
                paginationDiv.appendChild(pageButton);
            }

            // 다음 페이지 버튼
            const nextButton = document.createElement('button');
            nextButton.textContent = '>';
            nextButton.disabled = currentPage === totalPages - 1;
            nextButton.addEventListener('click', () => loadPage(section, currentPage + 1));
            paginationDiv.appendChild(nextButton);
        };

        const loadPage = (section, page) => {
            if (section === 'sales') {
                currentSalesPage = page;
                fetchConfirmedParks(page);
            } else if (section === 'confirm') {
                currentConfirmPage = page;
                fetchAllParks(page);
            } else if (section === 'notice') {
                currentNoticePage = page;
                fetchNotice(page);
            }
        };

        sidebarMenu.addEventListener('click', (e) => {
            if (e.target.tagName === 'LI') {
                // Remove active class from all sidebar items
                Array.from(sidebarMenu.getElementsByTagName('li')).forEach(li => {
                    li.classList.remove('active');
                });

                // Add active class to the clicked item
                e.target.classList.add('active');

                // Hide all contents
                contents.forEach(content => {
                    content.classList.remove('active');
                });

                // Show the clicked content
                const contentId = e.target.dataset.content + '-content';
                document.getElementById(contentId).classList.add('active');

                // Update the page title
                pageTitle.textContent = e.target.textContent;

                // Fetch data for the selected section
                 if (e.target.dataset.content === 'sales') {
                    fetchConfirmedParks(currentSalesPage);
                } else if (e.target.dataset.content === 'confirm') {
                    fetchAllParks(currentConfirmPage);
                } else if (e.target.dataset.content === 'notice') {
                    fetchNotices(currentNoticePage);
                }
        });

        // Initial data fetch for the default active section
        const activeSection = document.querySelector('.sidebar li.active').dataset.content;
        if (activeSection === 'sales') {
            fetchConfirmedParks(currentSalesPage);
        } else if (activeSection === 'confirm') {
            fetchAllParks(currentConfirmPage);
        } else if (activeSection === 'notice') {
            fetchNotices(currentNoticePage);
        }
    });
</script>
</body>
</html>

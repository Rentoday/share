<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice Modal</title>
    <style>
        .frame-modal-notice {
            width: 962px;
            height: 660px;
            border: 1px solid #ccc;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            background-color: white;
        }
        .frame-modal-notice .header {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        .close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            color: #1FBC21;
            cursor: pointer;
        }
        .notice-table {
            width: 100%;
            border-collapse: collapse;
        }
        .notice-table th, .notice-table td {
            border-top: 1px solid #1FBC21;
            border-bottom: 1px solid #1FBC21;
            border-left: none;
            border-right: none;
            padding: 10px;
            text-align: center;
        }
        .notice-table th {
            background-color: #f5f5f5;
        }
        .notice-table .expandable-content {
            display: none;
            padding: 10px;
            text-align: left;
        }
        .toggle-button {
            cursor: pointer;
            text-align: right;
            width: 30px;
        }
    </style>
</head>
<body>
<div class="frame-modal-notice">
    <div class="close-button">&times;</div>
    <div class="header">공지사항</div>
    <table class="notice-table">
        <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성일</th>
            <th class="toggle-button"></th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>1</td>
            <td>7월 19일부터 오픈이벤트 참여하고 쿠폰받자!</td>
            <td>24/07/19</td>
            <td class="toggle-button" onclick="toggleContent(this)">&#x25BC;</td>
        </tr>
        <tr class="expandable-content">
            <td colspan="4" style="text-align: left;">
                안녕하세요. 7월 19일부터 서비스를 오픈했습니다.<br>
                오픈이벤트로 쿠폰을 받습~~~~<br>
                ~~~~~~~
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    function toggleContent(button) {
        const row = button.closest('tr');
        const nextRow = row.nextElementSibling;
        const isExpanded = nextRow.style.display === 'table-row';
        if (isExpanded) {
            nextRow.style.display = 'none';
            button.innerHTML = '&#x25BC;'; // Down arrow
        } else {
            nextRow.style.display = 'table-row';
            button.innerHTML = '&#x25B2;'; // Up arrow
        }
    }
</script>
</body>
</html>

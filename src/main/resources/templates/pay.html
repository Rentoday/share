<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.iamport.kr/v1/iamport.js"></script>
    <link rel="stylesheet" href="css/pay/pay.css">
</head>
<body>
<div class="container">
    <h1>확인 및 결제</h1>
    <div class="reservation-info">
        <div class="parking-info">
            <h2>예약 정보</h2>
            <div class="info-item"><span>구획 번호:</span> 서울특별시 강남구 602-12 강남부재빌딩</div>
            <div class="info-item"><span>운영 시간:</span> 09:00 ~ 21:00</div>
            <div class="info-item"><span>시간당 요금:</span> 시간당 1,000원</div>
            <div class="info-item"><span>해당 관할 공단:</span> 강남구시설관리공단</div>
            <div class="info-item"><span>공단 전화번호:</span> 02)402-0000</div>
            <div class="info-item"><span>주차구역 상세설명:</span> 주차장 좋습니다.</div>
        </div>
        <div class="payment-summary">
            <div class="image-placeholder"></div>
            <h3>요금 세부정보</h3>
            <div>1시간 x 7,000원</div>
            <div class="price-summary">총 7,000 원</div>
            <button class="button">결제하기</button>
        </div>
    </div>
    <div class="notice">
        <h3>환불 정책</h3>
        <p>결제 완료시 취소하기 버튼에서 관련 내용을 확인하실 수 있습니다. 카카오페이 기준으로 작성되었습니다.</p>
    </div>
    <div class="notice">
        <h3>이용 규칙</h3>
        <p>각종 이용규칙이 명시되어있는 부분입니다. 주차장마다 다르게 작성될 수 있습니다.</p>
    </div>
</div>
<script>
    const IMP = window.IMP;
IMP.init("your_imp_key");

function requestPayment() {
    // 백엔드에서 결제 정보 받아오기
    fetch('/api/payments/request', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ reservationUid: 'your_reservation_uid' }),
    })
    .then(response => response.json())
    .then(data => {
        // 결제 요청
        IMP.request_pay({
            pg: "your_pg_provider",
            pay_method: "card",
            merchant_uid: data.reservationUid,
            name: data.reservationName,
            amount: data.price,
            buyer_email: data.buyerEmail,
            buyer_name: data.buyerName,
        }, function (rsp) {
            if (rsp.success) {
                // 결제 성공 시 백엔드에 결과 전송
                fetch('/api/payments/callback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        paymentUid: rsp.imp_uid,
                        reservationUid: rsp.merchant_uid,
                    }),
                })
                .then(response => response.text())
                .then(result => {
                    alert("결제가 완료되었습니다!");
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert("결제 처리 중 오류가 발생했습니다.");
                });
            } else {
                alert("결제에 실패하였습니다. 에러 내용: " + rsp.error_msg);
            }
        });
    })
    .catch(error => {
        console.error('Error:', error);
        alert("결제 요청 중 오류가 발생했습니다.");
    });
}
</script>
</body>
</html>

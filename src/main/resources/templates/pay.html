<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.iamport.kr/v1/iamport.js"></script>
    <link rel="stylesheet" href="css/pay/pay.css">
</head>
<body>
<div class="container">
    <h1>확인 및 결제</h1>
    <div class="reservation-info">
        <div class="parking-info">
            <h2>예약 정보</h2>
            <div class="info-item"><span>구획 번호:</span> <span id="parkingNum"></span></div>
            <div class="info-item"><span>운영 시간:</span> <span id="operatingHours"></span></div>
            <div class="info-item"><span>시간당 요금:</span> <span id="hourlyRate"></span></div>
            <div class="info-item"><span>해당 관할 공단:</span> <span id="agency"></span></div>
            <div class="info-item"><span>공단 전화번호:</span> <span id="agencyPhone"></span></div>
            <div class="info-item"><span>주차구역 상세설명:</span> <span id="parkingDescription"></span></div>
        </div>
        <div class="payment-summary">
            <div class="image-placeholder" id="parkImage"></div>
            <h3>요금 세부정보</h3>
            <div id="priceSummary"></div>
            <div class="price-summary" id="totalPrice"></div>
            <button class="button" onclick="requestPayment()">결제하기</button>
        </div>
    </div>
    <div class="notice">
        <h3>환불 정책</h3>
        <p>결제 완료시 취소하기 버튼에서 관련 내용을 확인하실 수 있습니다. 카카오페이 기준으로 작성되었습니다.</p>
    </div>
    <div class="notice">
        <h3>이용 규칙</h3>
        <p>각종 이용규칙이 명시되어있는 부분입니다. 주차장마다 다르게 작성될 수 있습니다.</p>
    </div>
</div>
<script>
    const IMP = window.IMP;
    IMP.init("your_imp_key");

    let reservationDetails;

    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const reservationUid = urlParams.get('reservationUid');

        if (!reservationUid) {
            alert('유효하지 않은 예약입니다.');
            window.location.href = '/';
            return;
        }

        fetchReservationDetails(reservationUid)
            .then(displayReservationDetails)
            .catch(error => {
                alert('예약 정보를 불러오는 중 오류가 발생했습니다: ' + error.message);
            });
    });

    async function fetchReservationDetails(reservationUid) {
        const response = await fetch(`/api/reservation/details?uid=${reservationUid}`);
        if (!response.ok) {
            throw new Error('예약 정보를 가져오는데 실패했습니다.');
        }
        return await response.json();
    }

    function displayReservationDetails(details) {
        reservationDetails = details;
        document.getElementById('parkingNum').textContent = details.parkingNum;
        document.getElementById('operatingHours').textContent = `${details.startTime} ~ ${details.endTime}`;
        document.getElementById('hourlyRate').textContent = `시간당 ${details.price}원`;
        document.getElementById('agency').textContent = details.agency;
        document.getElementById('agencyPhone').textContent = details.agencyPhone;
        document.getElementById('parkingDescription').textContent = details.description;
        document.getElementById('parkImage').style.backgroundImage = `url(${details.imageUrl})`;
        document.getElementById('priceSummary').textContent = `${details.duration}시간 x ${details.price}원`;
        document.getElementById('totalPrice').textContent = `총 ${details.totalPrice} 원`;
    }

    function requestPayment() {
        IMP.request_pay({
            pg: "html5_inicis",
            pay_method: "card",
            merchant_uid: reservationDetails.reservationUid,
            name: reservationDetails.reservationName,
            amount: reservationDetails.totalPrice,
            buyer_email: reservationDetails.buyerEmail,
            buyer_name: reservationDetails.buyerName,
        }, function (rsp) {
            if (rsp.success) {
                // 결제 성공 시 백엔드에 결과 전송
                fetch('/api/payments/callback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        paymentUid: rsp.imp_uid,
                        reservationUid: rsp.merchant_uid,
                    }),
                })
                .then(response => response.text())
                .then(result => {
                    alert("결제가 완료되었습니다!");
                    // 결제 완료 후 예약 확인 페이지로 이동
                    window.location.href = `/reservation-confirmation?reservationUid=${reservationDetails.reservationUid}`;
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert("결제 처리 중 오류가 발생했습니다.");
                });
            } else {
                alert("결제에 실패하였습니다. 에러 내용: " + rsp.error_msg);
            }
        });
    }
</script>
</body>
</html>

a<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.iamport.kr/v1/iamport.js"></script>
    <link rel="stylesheet" href="css/pay/pay.css">
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="/js/common/apiClient.js"></script>
</head>
<body>
<div class="container">
    <h1>확인 및 결제</h1>
    <div class="reservation-info">
        <div class="parking-info">
            <h2>예약 정보</h2>
            <div class="info-item"><span>구획 번호:</span> <span id="parkingNum"></span></div>
            <div class="info-item"><span>예약 시간:</span> <span id="operatingHours"></span></div>
            <div class="info-item"><span>총 요금:</span> <span id="hourlyRate"></span></div>
            <div class="info-item"><span>해당 관할 공단:</span> <span id="agency"></span></div>
            <div class="info-item"><span>공단 전화번호:</span> <span id="agencyPhone"></span></div>
            <div class="info-item"><span>주차구역 상세설명:</span> <span id="parkingDescription"></span></div>
        </div>
        <div class="payment-summary">
            <div class="image-placeholder" id="parkImage"></div>
            <h3>요금 세부정보</h3>
            <div id="priceSummary"></div>
            <div class="price-summary" id="totalPrice"></div>
            <button class="button" onclick="requestPayment()">결제하기</button>
        </div>
    </div>
    <div class="notice">
        <h3>환불 정책</h3>
        <p>결제 완료시 취소하기 버튼에서 관련 내용을 확인하실 수 있습니다. 카카오페이 기준으로 작성되었습니다.</p>
    </div>
    <div class="notice">
        <h3>이용 규칙</h3>
        <p>각종 이용규칙이 명시되어있는 부분입니다. 주차장마다 다르게 작성될 수 있습니다.</p>
    </div>
</div>
<script>
    let parkDetails;
    let selectedTimes = [];

    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const parkId = urlParams.get('parkId');
        const reservationUid = urlParams.get('reservationUid');
        const selectedTimesParam = urlParams.get('selectedTimes');

        if (!parkId || !reservationUid) {
            alert('유효하지 않은 주차장 또는 예약입니다.');
            window.location.href = '/';
            return;
        }

        if (selectedTimesParam) {
            selectedTimes = JSON.parse(decodeURIComponent(selectedTimesParam));
        }

        try {
            const details = await fetchParkDetails(parkId, reservationUid);
            displayDetails(details);
        } catch (error) {
            console.error('정보를 불러오는 중 오류가 발생했습니다:', error);
            alert('정보를 불러오는 중 오류가 발생했습니다.');
        }
    });

    async function fetchParkDetails(parkId, reservationUid) {
        try {
            const response = await api.get(`/api/parks/${parkId}/details?reservationUid=${reservationUid}`);
            console.log(response.data);  // 응답 데이터를 콘솔에 출력하여 확인합니다.
            return response.data;
        } catch (error) {
            console.error('주차장 정보를 가져오는데 실패했습니다:', error);
            throw error;
        }
    }

    function displayDetails(details) {
        if (!details) {
            console.error('주차장 상세 정보가 없습니다.');
            return;
        }

        document.getElementById('parkingNum').textContent = details.parkingNum || '정보 없음';

        const operatingHours = selectedTimes.map(time => {
            const startHour = time.hours;
            const startMinute = time.minutes;
            const endHour = startHour + 1;
            return `${formatTime(startHour, startMinute)} ~ ${formatTime(endHour, startMinute)}`;
        }).join(', ');
        document.getElementById('operatingHours').textContent = operatingHours || '정보 없음';

        document.getElementById('hourlyRate').textContent = details.price ? `${details.price}원` : '정보 없음';
        document.getElementById('agency').textContent = details.agency || '정보 없음';
        document.getElementById('agencyPhone').textContent = details.agencyPhone || '정보 없음';
        document.getElementById('parkingDescription').textContent = details.description || '정보 없음';

        const totalPrice = details.price;
        document.getElementById('totalPrice').textContent = `총 요금: ${totalPrice} 원`;

        parkDetails = details;
    }

    function formatTime(hours, minutes) {
        const formattedHours = hours < 10 ? `0${hours}` : hours;
        const formattedMinutes = minutes < 10 ? `0${minutes}` : minutes;
        return `${formattedHours}:${formattedMinutes}`;
    }

    async function requestPayment() {
        try {
            // 아임포트 초기화
            IMP.init('imp38815102');

            const response = await api.post('/api/pays/request', {
                reservationUid: parkDetails.reservationUid
            });
            const paymentData = response.data;

            IMP.request_pay({
                pg: "html5_inicis",
                pay_method: "card",
                merchant_uid: paymentData.reservationUid,
                name: `주차장 예약 - ${parkDetails.parkingNum}`,
                amount: paymentData.price,
                buyer_email: paymentData.buyerEmail,
                buyer_name: paymentData.buyerName,
                m_redirect_url: "/pay/complete"
            }, async function (rsp) {
                if (rsp.success) {
                    try {
                        const callbackResponse = await api.post('/api/pays/callback', {
                            paymentUid: rsp.imp_uid,
                            reservationUid: rsp.merchant_uid,
                        });

                        if (callbackResponse.status === 200) {
                            alert("결제가 완료되었습니다!");
                            window.location.href = `/reservation-confirmation?reservationUid=${paymentData.reservationUid}`;
                        } else {
                            throw new Error(callbackResponse.data.message || '서버 응답 오류');
                        }
                    } catch (error) {
                        console.error('결제 콜백 처리 중 오류:', error);
                        alert("결제 처리 중 오류가 발생했습니다: " + (error.message || "알 수 없는 오류"));
                    }
                } else {
                    alert("결제가 실패했습니다: " + rsp.error_msg);
                }
            });
        } catch (error) {
            console.error('결제 요청 중 오류가 발생했습니다:', error);
            alert('결제 요청 중 오류가 발생했습니다.');
        }
    }
</script>
</body>
</html>

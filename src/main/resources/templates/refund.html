<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제내역</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: rgba(0,0,0,0.5);
        }
        .frame_modal_refund {
            width: 719px;
            height: 499px;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            color: #4CAF50;
            cursor: pointer
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        label {
            width: 80px;
            text-align: right;
            margin-right: 20px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #4CAF50;
            border-radius: 4px;
        }
        .time-input {
            display: flex;
            align-items: center;
        }
        .time-input input {
            width: 80px;
        }
        .time-input span {
            margin: 0 10px;
        }
        .submit-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: block;
            font-size: 16px;
            margin: 30px auto 0;
            cursor: pointer;
            width: 100%;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="frame_modal_refund">
    <span class="close-btn">&times;</span>
    <h2>결제내역</h2>
    <div class="form-group">
        <label for="area-number">구획번호</label>
        <input type="text" id="area-number" value="12가1234">
    </div>
    <div class="form-group">
        <label for="price">주소</label>
        <input type="text" id="price" value="12가1234">
    </div>
    <div class="form-group">
        <label>시간</label>
        <div class="time-input">
            <input type="text" value="09:00">
            <span>~</span>
            <input type="text" value="09:00">
        </div>
    </div>
    <div class="form-group">
        <label for="total-price">총 요금</label>
        <input type="text" id="total-price" value="12000">
    </div>
    <div class="form-group">
        <label for="payment-details">결제수단</label>
        <input type="text" id="payment-details" value="12가1234">
    </div>
    <button class="submit-btn">취소 요청</button>
</div>
</body>
</html>

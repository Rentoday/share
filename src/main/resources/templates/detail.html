<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/detail/detail.css">
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="/js/common/apiClient.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var parkId = /*[[${parkId}]]*/ null;
        /*]]>*/
    </script>
</head>
<body>
<div class="container">
    <div class="main-content">
        <div class="image-container" id="imageContainer"></div>
        <h2 id="parkingNum"></h2>
        <p>주소: <span id="address"></span></p>
        <p>운영 시간: <span id="operatingHours"></span></p>
        <p>시간당 요금: <span id="price"></span>원</p>
        <p>관리 기관: <span id="agency"></span></p>
        <p>관리 기관 연락처: <span id="agNum"></span></p>
        <p>상세 설명: <span id="content"></span></p>
    </div>
    <div class="sidebar">
        <h3>예약 가능 시간</h3>
        <div id="timeSlots"></div>
        <p>선택된 시간: <span id="selectedTime"></span></p>
        <p>예상 요금: <span id="estimatedPrice"></span>원</p>
        <button id="reserveButton">예약하기</button>
    </div>
    <div class="description">
        <h3>주차구역 상세설명</h3>
        <p>주차장 좋습니다.</p>
    </div>
    <div class="review-section">
        <h3>리뷰</h3>
        <div id="comments"></div>
        <textarea id="commentText" placeholder="댓글을 입력하세요" name="content"></textarea>
        <button id="submitComment">댓글 작성</button>
    </div>
</div>

<script>

    document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
const parkId = urlParams.get('parkId');

if (!parkId) {
    alert('주차장 ID가 없습니다.');
    window.location.href = '/';
}

let parkDetail = {};
let reservedTimes = [];
let selectedTime;
let currentUser;

async function fetchCurrentUser() {
    try {
        const response = await api.get('/api/member/info');
        currentUser = response.data;
    } catch (error) {
        console.error('사용자 정보를 가져오는데 실패했습니다:', error);
        throw error;
    }
}

async function fetchParkDetail() {
    try {
        const response = await api.get(`/api/parks/${parkId}`);
        parkDetail = response.data;
        displayParkDetail();
        await fetchReservedTimes();
    } catch (error) {
        console.error('주차장 상세 정보를 가져오는데 실패했습니다:', error);
    }
}

async function fetchReservedTimes() {
    try {
        const response = await api.get(`/api/parks/${parkId}/available-times`);
        reservedTimes = response.data.map(time => {
            const [hours, minutes] = time.split(':');
            return { hours: parseInt(hours), minutes: parseInt(minutes) };
        });
        displayTimeSlots();
    } catch (error) {
        console.error('예약된 시간을 가져오는데 실패했습니다:', error);
    }
}

function displayParkDetail() {
    if (!parkDetail) {
        console.error('주차장 상세 정보가 없습니다.');
        return;
    }

    document.getElementById('parkingNum').textContent = parkDetail.parkingNum || '';
    document.getElementById('address').textContent = parkDetail.address || '';
    document.getElementById('operatingHours').textContent = parkDetail.startTime && parkDetail.endTime
        ? `${formatTime(parseTime(parkDetail.startTime))} - ${formatTime(parseTime(parkDetail.endTime))}`
        : '운영 시간 정보 없음';
    document.getElementById('price').textContent = parkDetail.price || '';
    document.getElementById('agency').textContent = parkDetail.agency || '';
    document.getElementById('agNum').textContent = parkDetail.agNum || '';
    document.getElementById('content').textContent = parkDetail.content || '';

    const imageContainer = document.getElementById('imageContainer');
    imageContainer.innerHTML = ''; // 기존 이미지 제거
    if (parkDetail.parkImages && parkDetail.parkImages.length > 0) {
        parkDetail.parkImages.slice(0, 3).forEach(image => {
            const img = document.createElement('img');
            img.src = image.imageUrl;
            imageContainer.appendChild(img);
        });
    }
}

function displayTimeSlots() {
    const timeSlotsContainer = document.getElementById('timeSlots');
    timeSlotsContainer.innerHTML = ''; // 기존 슬롯 제거

    if (!parkDetail.startTime || !parkDetail.endTime) {
        console.error('운영 시간 정보가 없습니다.');
        return;
    }

    let currentTime = parseTime(parkDetail.startTime);
    const endTime = parseTime(parkDetail.endTime);

    while (currentTime.hours < endTime.hours || (currentTime.hours === endTime.hours && currentTime.minutes < endTime.minutes)) {
        const button = document.createElement('button');
        button.textContent = formatTime(currentTime);
        button.classList.add('time-slot');

        if (isReserved(currentTime)) {
            button.classList.add('reserved');
            button.disabled = true;
        } else {
            button.onclick = () => selectTimeSlot(currentTime);
        }

        timeSlotsContainer.appendChild(button);
        currentTime = addHour(currentTime);
    }
}

function isReserved(time) {
    return reservedTimes.some(reservedTime =>
        reservedTime.hours === time.hours &&
        reservedTime.minutes === time.minutes
    );
}

function formatTime(time) {
    return `${time.hours.toString().padStart(2, '0')}:${time.minutes.toString().padStart(2, '0')}`;
}

function parseTime(timeString) {
    if (!timeString) return { hours: 0, minutes: 0 };
    const [hours, minutes] = timeString.split(':').map(Number);
    return { hours, minutes };
}

function addHour(time) {
    let newHours = time.hours + 1;
    if (newHours >= 24) {
        newHours -= 24;
    }
    return { hours: newHours, minutes: time.minutes };
}

document.addEventListener('DOMContentLoaded', fetchParkDetail);
    document.getElementById('reserveButton').onclick = async () => {
    if (!selectedTime) {
        alert('시간을 선택해주세요.');
        return;
    }

    if (!currentUser) {
        alert('로그인이 필요합니다.');
        return;
    }

    const reservationData = {
        parkId: parseInt(parkId),
        memberId: currentUser.id,
        checkIn: selectedTime.toISOString(),
        reservationName: `예약 - ${parkDetail.parkingNum}`
    };

    try {
        const response = await api.post('/api/reservation', reservationData);
        window.location.href = `/payment?reservationUid=${response.data.reservationUid}`;
    } catch (error) {
        console.error('예약 생성에 실패했습니다:', error);
        alert('예약 생성에 실패했습니다.');
    }
};

async function submitComment() {
    const commentText = document.getElementById('commentText').value;
    if (!commentText) {
        alert('댓글을 입력해주세요.');
        return;
    }

    const createRequest = {
        content: commentText
    };

    try {
        await api.post(`/api/comment/${parkId}`, createRequest);
        alert('댓글이 작성되었습니다.');
        document.getElementById('commentText').value = '';
        fetchComments();
    } catch (error) {
        console.error('댓글 작성에 실패했습니다:', error);
        alert('댓글 작성에 실패했습니다.');
    }
}

async function updateComment(commentId, newContent) {
    const updateRequest = {
        content: newContent
    };

    try {
        await api.put(`/api/comment/${commentId}`, updateRequest);
        alert('댓글이 수정되었습니다.');
        fetchComments();
    } catch (error) {
        console.error('댓글 수정에 실패했습니다:', error);
        alert('댓글 수정에 실패했습니다.');
    }
}

async function deleteComment(commentId) {
    try {
        await api.delete(`/api/comment/${commentId}`);
        alert('댓글이 삭제되었습니다.');
        fetchComments();
    } catch (error) {
        console.error('댓글 삭제에 실패했습니다:', error);
        alert('댓글 삭제에 실패했습니다.');
    }
}

async function fetchComments() {
    try {
        const response = await api.get(`/api/comment/${parkId}`);
        displayComments(response.data);
    } catch (error) {
        console.error('댓글을 가져오는데 실패했습니다:', error);
        alert('댓글을 가져오는데 실패했습니다.');
    }
}

    function displayComments(comments) {
        const commentsContainer = document.getElementById('comments');
        commentsContainer.innerHTML = '';

        comments.forEach(comment => {
            const commentElement = document.createElement('div');
            commentElement.classList.add('comment');
            commentElement.innerHTML = `
                <p>${comment.content}</p>
                <button onclick="updateComment(${comment.id}, prompt('수정할 내용을 입력하세요:'))">수정</button>
                <button onclick="deleteComment(${comment.id})">삭제</button>
            `;
            commentsContainer.appendChild(commentElement);
        });
    }

    document.getElementById('submitComment').onclick = submitComment;

    // 페이지 로드 시 실행
    fetchCurrentUser().catch(error => alert(error.message));
    fetchParkDetail().catch(error => alert(error.message));
    fetchReservedTimes().catch(error => alert(error.message));
    fetchComments().catch(error => alert(error.message));
    });
</script>
</body>
</html>

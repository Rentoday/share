<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/detail/detail.css">
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="/js/common/apiClient.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var parkId = /*[[${parkId}]]*/ null;
        /*]]>*/
    </script>
</head>
<body>
<div class="container">
    <div class="main-content">
        <div class="image-container" id="imageContainer"></div>
        <h2 id="parkingNum"></h2>
        <p>주소: <span id="address"></span></p>
        <p>운영 시간: <span id="operatingHours"></span></p>
        <p>시간당 요금: <span id="price"></span>원</p>
        <p>관리 기관: <span id="agency"></span></p>
        <p>관리 기관 연락처: <span id="agNum"></span></p>
        <p>상세 설명: <span id="content"></span></p>
    </div>
    <div class="sidebar">
        <h3>예약 가능 시간</h3>
        <div id="timeSlots"></div>
        <p>선택된 시간: <span id="selectedTime"></span></p>
        <p>예상 요금: <span id="estimatedPrice"></span>원</p>
        <button id="reserveButton">예약하기</button>
    </div>
    <div class="description">
        <h3>주차구역 상세설명</h3>
        <p>주차장 좋습니다.</p>
    </div>
    <div class="review-section">
        <h3>리뷰</h3>
        <div id="comments"></div>
        <textarea id="commentText" placeholder="댓글을 입력하세요" name="content"></textarea>
        <button id="submitComment">댓글 작성</button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async function() {
    const urlParams = new URLSearchParams(window.location.search);
    const parkId = urlParams.get('parkId');

    if (!parkId) {
        alert('주차장 ID가 없습니다.');
        window.location.href = '/';
        return;
    }

    let parkDetail = {};
    let selectedTimes = [];
    let currentUser;

    async function fetchCurrentUser() {
        try {
            const response = await api.get('/api/member/info'); // axios를 사용하여 사용자 정보 가져오기
            currentUser = response.data;
        } catch (error) {
            console.error('사용자 정보를 가져오는데 실패했습니다:', error);
            throw error;
        }
    }

    async function fetchParkDetail() {
        try {
            const response = await api.get(`/api/parks/${parkId}`); // axios를 사용하여 주차장 상세 정보 가져오기
            parkDetail = response.data;
            displayParkDetail();
            await fetchAvailableTimes();
        } catch (error) {
            console.error('주차장 상세 정보를 가져오는데 실패했습니다:', error);
        }
    }

    async function fetchAvailableTimes() {
        try {
            const response = await api.get(`/api/parks/${parkId}/available-times`); // 가능한 시간 가져오기
            const availableTimes = response.data.map(time => {
                const [hours, minutes] = time.split(':');
                return { hours: parseInt(hours), minutes: parseInt(minutes) };
            });
            displayTimeSlots(availableTimes);
        } catch (error) {
            console.error('사용 가능한 시간을 가져오는데 실패했습니다:', error);
        }
    }

    function displayParkDetail() {
        if (!parkDetail) {
            console.error('주차장 상세 정보가 없습니다.');
            return;
        }

        document.getElementById('parkingNum').textContent = parkDetail.parkingNum || '';
        document.getElementById('address').textContent = parkDetail.address || '';
        document.getElementById('operatingHours').textContent = parkDetail.startTime && parkDetail.endTime
            ? `${formatTime(parseTime(parkDetail.startTime))} - ${formatTime(parseTime(parkDetail.endTime))}`
            : '운영 시간 정보 없음';
        document.getElementById('price').textContent = parkDetail.price || '';
        document.getElementById('agency').textContent = parkDetail.agency || '';
        document.getElementById('agNum').textContent = parkDetail.agNum || '';
        document.getElementById('content').textContent = parkDetail.content || '';

        const imageContainer = document.getElementById('imageContainer');
        imageContainer.innerHTML = '';
        if (parkDetail.parkImages && parkDetail.parkImages.length > 0) {
            parkDetail.parkImages.slice(0, 3).forEach(image => {
                const img = document.createElement('img');
                img.src = image.imageUrl;
                imageContainer.appendChild(img);
            });
        }
    }

    function displayTimeSlots(availableTimes) {
        const timeSlotsContainer = document.getElementById('timeSlots');
        timeSlotsContainer.innerHTML = '';

        if (!parkDetail.startTime || !parkDetail.endTime) {
            console.error('운영 시간 정보가 없습니다.');
            return;
        }

        availableTimes.forEach(time => {
            const button = document.createElement('button');
            button.textContent = formatTime(time);
            button.classList.add('time-slot');
            button.onclick = () => selectTimeSlot(time, button);
            timeSlotsContainer.appendChild(button);
        });
    }

    function formatTime(time) {
        return `${time.hours.toString().padStart(2, '0')}:${time.minutes.toString().padStart(2, '0')}`;
    }

    function parseTime(timeString) {
        if (!timeString) return { hours: 0, minutes: 0 };
        const [hours, minutes] = timeString.split(':').map(Number);
        return { hours, minutes };
    }

    function addHour(time) {
        let newHours = time.hours + 1;
        if (newHours >= 24) {
            newHours -= 24;
        }
        return { hours: newHours, minutes: time.minutes };
    }

    function selectTimeSlot(time, button) {
        const timeIndex = selectedTimes.findIndex(
            selectedTime => selectedTime.hours === time.hours && selectedTime.minutes === time.minutes
        );

        if (timeIndex !== -1) {
            selectedTimes.splice(timeIndex, 1);
            button.classList.remove('selected');
        } else {
            selectedTimes.push(time);
            button.classList.add('selected');
        }

        updateSelectedTimeAndPrice();
    }

    function updateSelectedTimeAndPrice() {
        const selectedTimeContainer = document.getElementById('selectedTime');
        const estimatedPriceContainer = document.getElementById('estimatedPrice');

        selectedTimeContainer.textContent = selectedTimes.map(time => formatTime(time)).join(', ');

        const totalPrice = selectedTimes.length * (parkDetail.price || 0);
        estimatedPriceContainer.textContent = totalPrice;
    }

    document.getElementById('reserveButton').addEventListener('click', async () => {
        if (!selectedTimes || selectedTimes.length === 0) {
            alert('시간을 선택해주세요.');
            return;
        }

        if (!currentUser) {
            alert('로그인이 필요합니다.');
            return;
        }

        const earliestCheckInTime = selectedTimes.reduce((earliest, time) => {
            if (time.hours < earliest.hours || (time.hours === earliest.hours && time.minutes < earliest.minutes)) {
                return time;
            }
            return earliest;
        }, selectedTimes[0]);

        const latestCheckInTime = selectedTimes.reduce((latest, time) => {
            if (time.hours > latest.hours || (time.hours === latest.hours && time.minutes > latest.minutes)) {
                return time;
            }
            return latest;
        }, selectedTimes[0]);

        const checkOutTime = addHour(latestCheckInTime);

        const reservationData = {
            email: currentUser.email,
            parkId: parseInt(parkId),
            checkInTimes: selectedTimes.map(time =>
                `${time.hours.toString().padStart(2, '0')}:${time.minutes.toString().padStart(2, '0')}`
            ),
            estimatedPrice: selectedTimes.length * parkDetail.price,
            checkOutTime: `${checkOutTime.hours.toString().padStart(2, '0')}:${checkOutTime.minutes.toString().padStart(2, '0')}`
        };

        try {
            const response = await api.post('/api/reservations', reservationData);
            const reservationUid = response.data.reservationUid;
            window.location.href = `/pay?parkId=${parkId}&reservationUid=${reservationUid}`;
        } catch (error) {
            console.error('예약 생성에 실패했습니다:', error);
            alert('예약 생성에 실패했습니다.');
        }
    });

    await fetchCurrentUser();
    await fetchParkDetail();
});




</script>
</body>
</html>

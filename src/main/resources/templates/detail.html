<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/detail/detail.css">
</head>
<body>
<div class="container">
    <h1 class="page-title">주차 예약</h1>
    <div class="layout">
        <div class="main-content">
            <div class="image-placeholder main-image">이미지</div>
            <div class="sub-images">
                <div class="image-placeholder sub-image">이미지</div>
                <div class="image-placeholder sub-image">이미지</div>
            </div>
            <div class="info-section">
                <div class="info-item">
                    <span class="info-label">구획 번호</span>
                    <span class="info-value" id="location">서울특별시 강남구 602-12 강남부재빌딩</span>
                </div>
                <div class="info-item">
                    <span class="info-label">운영 시간</span>
                    <span class="info-value" id="operating-hours">09:00 - 21:00</span>
                </div>
                <div class="info-item">
                    <span class="info-label">시간당 요금</span>
                    <span class="info-value" id="hourly-rate">시간당 1,000원</span>
                </div>
                <div class="info-item">
                    <span class="info-label">해당 관할 공단</span>
                    <span class="info-value" id="management-office">강남구시설관리공단</span>
                </div>
                <div class="info-item">
                    <span class="info-label">공단 전화번호</span>
                    <span class="info-value" id="phone-number">02)402-0000</span>
                </div>
            </div>
            <div class="description">
                <h3>주차구역 상세설명</h3>
                <p>주차장 좋습니다.</p>
            </div>
            <div class="review-section">
                <h3>리뷰</h3>
                <p>000구매자 주차장 좋습니다.</p>
            </div>
        </div>
        <div class="sidebar-container">
            <div class="sidebar">
                <h3>대여시간</h3>
                <div class="time-slots">
                    <button class="time-slot active">09:00</button>
                    <button class="time-slot">10:00</button>
                    <button class="time-slot">11:00</button>
                    <button class="time-slot">12:00</button>
                </div>
                <div class="price-summary">
                    1시간 X 7,000원
                </div>
                <form id="reservation-form"  onsubmit="reserveParking(event)">
                    <input type="hidden" name="location" value="서울특별시 강남구 602-12 강남부재빌딩">
                    <input type="hidden" name="operating_hours" value="09:00 - 21:00">
                    <input type="hidden" name="hourly_rate" value="시간당 1,000원">
                    <input type="hidden" name="management_office" value="강남구시설관리공단">
                    <input type="hidden" name="phone_number" value="02)402-0000">
                    <button type="submit" class="reserve-button">예약하기</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    function reserveParking(event) {
        event.preventDefault(); // 기본 이벤트 제거 (페이지 이동 방지)

        // 예약 정보 가져오기
        const location = document.getElementById('location').value;
        const operatingHours = document.getElementById('operating-hours').value;
        const hourlyRate = document.getElementById('hourly-rate').value;
        const managementOffice = document.getElementById('management-office').value;
        const phoneNumber = document.getElementById('phone-number').value;

        // AJAX 요청
        fetch('/api/reservation', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                parkId: 'your_park_id',
                memberId: 'your_member_id',
                paymentId: 'your_payment_id',
                checkIn: 'your_check_in_time',
                reservationUid: 'your_reservation_uid',
                reservationName: 'your_reservation_name'
            }),
        })
        .then(response => response.json())
        .then(data => {
            // 예약 정보를 성공적으로 받은 경우, 결제 페이지로 이동
            window.location.href = '/pay';
        })
        .catch(error => {
            console.error('Error:', error);
            alert('예약 요청 중 오류가 발생했습니다.');
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: rgba(0,0,0,0.5);
        }
        .frame_modal_notice {
            width: 719px;
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: #4CAF50;
            cursor: pointer;
        }
        h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        label {
           width: 60px; /* 라벨의 너비를 고정합니다 */
            margin-right: 10px;
            font-size: 14px; /* 글씨 크기를 줄입니다 */
            white-space: nowrap;
                text-align: -webkit-right
        }
        input[type="text"], textarea {
            flex: 1; /* 남은 공간을 모두 차지하도록 합니다 */
            padding: 10px;
            border: 1px solid #4CAF50;
            border-radius: 5px;
            font-size: 16px;
        }
        textarea {
            height: 400px;
            resize: none;
        }
        .submit-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 20px;
            text-align: center;
            text-decoration: none;
            display: block;
            font-size: 18px;
            margin: 30px auto 0;
            cursor: pointer;
            width: 100%;
            border-radius: 25px;
        }
    </style>
</head>
<body>
<div class="frame_modal_notice">
    <span class="close-btn">&times;</span>
    <h2>공지사항</h2>
    <div class="form-group">
        <label for="title">제목</label>
        <input type="text" id="title" value="12가1234">
    </div>
    <div class="form-group">
        <label for="content">내용</label>
        <textarea id="content">12가1234</textarea>
    </div>
    <button class="submit-btn">등록하기</button>
</div>
</body>
</html>
